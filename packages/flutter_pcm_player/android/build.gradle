group 'com.example.flutter_pcm_player'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.example.flutter_pcm_player'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk 24
    }
}
