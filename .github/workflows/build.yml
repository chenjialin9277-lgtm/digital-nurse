name: Digital Nurse checks

on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Golden images were captured on macOS; keep the rendering platform stable.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: bash scripts/check.sh

  android-debug:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: cd android && ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: digital-nurse-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
