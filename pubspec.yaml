name: digital_nurse
description: "A tablet-first digital nurse client for the Xiaozhi AI protocol."
publish_to: none
version: 0.15.1+18

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^2.4.0
  opus_flutter: ^3.0.3
  opus_dart: ^3.0.1
  permission_handler: ^11.4.0
  audio_session: ^0.1.18
  flutter_pcm_player:
    path: packages/flutter_pcm_player
  record: ^5.2.1
  sherpa_onnx: ^1.13.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/tts/vits-piper-zh_CN-xiao_ya-medium/
    - assets/tts/vits-cantonese-hf-xiaomaiiwn/
    - assets/tts/vits-piper-en_US-amy-low/
    - assets/tts/vits-piper-en_US-amy-low/espeak-ng-data/
    - assets/tts/vits-piper-en_US-amy-low/espeak-ng-data/lang/gmw/
